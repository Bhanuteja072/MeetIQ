services:
  - type: web
    name: meetiq
    runtime: docker
    plan: free
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DATABASE_NAME
        value: Meeting_Partner
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: 4320
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: MAX_FILE_SIZE_MB
        value: 100
      - key: PORT
        value: 8000